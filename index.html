<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curtain Call Photobooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Special+Elite&family=Fredoka:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ LOBBY: three curtains ============ -->
  <section id="lobby" class="screen">
    <header class="marquee">
      <h1>Photobooth</h1>
      <span class="bulbs" aria-hidden="true"></span>
      <p>Pick a curtain &middot; Strike a pose</p>
    </header>

    <div class="booths">
      <button class="booth" data-style="retro" aria-label="Enter the Retro Film booth">
        <span class="sign">Retro Film</span>
        <span class="stage">
          <span class="inside"><span class="peek">🎞️</span><span class="peek-text">Step inside</span></span>
          <span class="curtain left"></span><span class="curtain right"></span>
        </span>
        <span class="tag">Four film stocks &middot; grain &middot; date stamp</span>
      </button>

      <button class="booth" data-style="kawaii" aria-label="Enter the Kawaii booth">
        <span class="sign">Kawaii</span>
        <span class="stage">
          <span class="inside"><span class="peek">🎀</span><span class="peek-text">Step inside</span></span>
          <span class="curtain left"></span><span class="curtain right"></span>
        </span>
        <span class="tag">Heart &amp; star frames &middot; props &middot; cute backgrounds</span>
      </button>
    </div>
  </section>

  <!-- ============ BOOTH: live camera ============ -->
  <section id="booth" class="screen">
    <div class="booth-top">
      <button id="backBtn" class="btn ghost small">&larr; Lobby</button>
      <h2 id="boothTitle"></h2>
      <span class="spacer"></span>
    </div>

    <div class="booth-body">
      <div class="viewer">
        <div id="frame" class="frame">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="shapeMask" class="shape-mask" hidden></canvas>
          <div id="stickerLayer" class="sticker-layer"></div>
          <div id="countdown" class="countdown" aria-live="assertive"></div>
          <div id="flash" class="flash"></div>
          <div id="camError" class="cam-error" hidden></div>
        </div>
        <div id="shots" class="shots" aria-label="Captured photos">
          <span></span><span></span><span></span>
        </div>
        <div class="controls">
          <button id="filmBtn" class="film-btn" disabled>Film</button>
        </div>
      </div>
      <aside id="palette" class="palette"></aside>
    </div>
  </section>

  <!-- ============ PRINT: strip + QR ============ -->
  <section id="print" class="screen">
    <div class="print-wrap">
      <div id="printer" class="printer">
        <div class="printer-head"><span class="led"></span><span class="printer-label">Printing&hellip;</span></div>
        <div class="paper-wrap"><img id="stripImg" alt="Your photo strip"></div>
      </div>

      <div id="takeHome" class="take-home">
        <h2>Take it home</h2>
        <p class="sub">Scan with your phone camera</p>
        <div id="qr" class="qr"></div>
        <p id="qrStatus" class="qr-status"></p>
        <div class="actions">
          <a id="downloadBtn" class="btn">Download</a>
          <button id="againBtn" class="btn ghost">Shoot again</button>
          <button id="lobbyBtn" class="btn ghost">Lobby</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ RECEIVE: opened on the phone via QR ============ -->
  <section id="receive" class="screen">
    <div class="receive-card">
      <h1>Your photo strip</h1>
      <p id="rxStatus">Connecting to the booth&hellip;</p>
      <img id="rxImg" alt="Your photo strip" hidden>
      <div id="rxActions" class="actions" hidden>
        <button id="rxShare" class="btn" hidden>Save to Photos</button>
        <a id="rxDownload" class="btn">Download</a>
      </div>
      <p id="rxHint" class="hint" hidden>Tip: you can also press and hold the image to save it.</p>
    </div>
  </section>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
